<!-- Shared Footer (src/partials/footer.html) -->
<footer class="bg-black py-16 border-t border-white/10">
  <div class="max-w-7xl mx-auto px-4">
    <div
      class="flex flex-col md:flex-row justify-between items-center gap-8 pb-8 border-b border-white/5"
    >
      <div class="flex items-center group">
        <img
          src="{{$site}}assets/grasshopper-geometric-logo.svg"
          alt="{{common.alt_footer_logo}}"
          class="w-8 h-8 mr-3 opacity-70 group-hover:opacity-100 transition-opacity"
        />
        <div>
          <span class="block text-xl font-mono font-bold text-white"
            >Grasshopper Solutions</span
          >
          <span class="block text-[11px] font-mono text-grass-green/80"
            >{{common.slogan}}</span
          >
        </div>
      </div>

      <div class="flex flex-col items-center md:items-end gap-2">
        <a
          href="mailto:general@grasshoppersolutions.online"
          class="text-sm font-mono text-gray-400 hover:text-grass-green transition-colors"
          >general@grasshoppersolutions.online</a
        >
        <div class="flex gap-4 items-center">
          <a
            href="https://www.facebook.com/profile.php?id=1308660815667618"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="{{common.aria_facebook}}"
            class="text-gray-600 hover:text-white transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <div
      class="pt-6 flex flex-col md:flex-row justify-between items-center gap-3"
    >
      <p class="text-gray-700 text-[11px] font-mono text-center md:text-left">
        &copy; <span id="footer-year">2026</span> {{common.rights}}
      </p>
      <p class="text-gray-700 text-[10px] font-mono">
        {{common.local_time}} <span id="time">00:00:00</span>
      </p>
    </div>
  </div>
</footer>

<script>
  (function () {
    var y = document.getElementById("footer-year");
    if (y) y.textContent = new Date().getFullYear();
  })();
</script>
